name: Validate Doc Folder

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  check-doc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify /doc folder and files exist
        run: |
          if [ ! -d "doc" ]; then
            echo "Error: /doc directory missing!"
            exit 1
          fi
          
          echo "Checking required files in /doc..."
          ls -la doc/
          
          # Check for ERD file (PNG or PDF)
          if ! ls doc/*.png doc/*.pdf 1> /dev/null 2>&1; then
            echo "Error: ERD image or PDF missing in /doc!"
            exit 1
          fi
          
          # Check for API Endpoint plan (.md or .pdf)
          if [ ! -f "doc/API-Endpoint-plan.md" ] && ! ls doc/*.pdf 1> /dev/null 2>&1; then
            echo "Error: API plan missing in /doc!"
            exit 1
          fi
          
          # Check for SQL script (.sql)
          if ! ls doc/*.sql 1> /dev/null 2>&1; then
            echo "Error: SQL script missing in /doc!"
            exit 1
          fi
          
          echo "All required planning documents found successfully in /doc!"

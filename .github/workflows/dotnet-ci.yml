name: RaceDay CI/CD Build and Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Dependencies
      run: dotnet restore RaceDay.sln

    - name: Build Solution
      run: dotnet build RaceDay.sln --no-restore -c Release

    - name: Run Unit Tests
      run: dotnet test RaceDay.sln --no-build -c Release
